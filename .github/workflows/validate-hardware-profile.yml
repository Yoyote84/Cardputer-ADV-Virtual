name: Validate hardware profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/app.mjs
          for file in app/emulator/*.mjs; do node --check "$file"; done
          python -m py_compile tools/install_esp_emu.py
      - name: Test interface and peripheral models
        run: node --test tests/*.test.mjs
      - name: Test runtime installer safety
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate hardware profile
        run: python tools/validate_profile.py
