name: Validate hardware profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check interface JavaScript syntax
        run: node --check app/app.js
      - name: Test Cardputer interface contract
        run: node --test tests/interface.test.mjs
      - name: Validate hardware profile
        run: python tools/validate_profile.py
